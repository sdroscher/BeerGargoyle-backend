version: '3'

tasks:
  grpc:
    desc: Generate the gRPC proto code
    cmds:
      - buf generate protobuf
    sources:
      - protobuf/api/v1/user.proto
      - protobuf/api/v1/beer.proto
      - protobuf/api/v1/cellar.proto
    generates:
      - generated/grpc/api/v1/user.pb.go
      - generated/grpc/api/v1/beer.pb.go
      - generated/grpc/api/v1/cellar.pb.go

  mocks:
    desc: Generate mocks
    cmds:
      - go generate ./...

  build:
    desc: Build the backend app
    deps: [grpc, mocks]
    cmds:
      - go build -v -o BeerGargoyle main.go

  serve:
    desc: Start the backend server
    deps: [build]
    cmds:
      - gow run . serve

  serve-dev:
    desc: Start the backend server with JWT auth disabled (use x-dev-user-email header)
    deps: [build]
    cmds:
      - gow run . serve --no-auth

  migrate:
    desc: Update the database schema
    deps: [build]
    cmds:
      - go run . migrate

  lint:
    desc: Run linting
    deps: [build]
    cmds:
      - golangci-lint --verbose run

  test:
    desc: Run tests
    deps: [build]
    cmds:
      - gotestsum -- -coverprofile=cover.out $(go list ./... | grep -v generated/)
      - sh scripts/coverage.sh
    env:
      TESTCOVERAGE_THRESHOLD: 41

  check:
    desc: pre-commit checks
    deps: [test, lint]

  grpcui:
    desc: Start the gRPC UI
    cmds:
      - grpcui -plaintext -import-path protobuf -proto api/v1/beer.proto -proto api/v1/cellar.proto -proto api/v1/user.proto 127.0.0.1:8380

  backfill:
    desc: One-time bootstrap of Activity records from existing CellarEntry timestamps
    deps: [build]
    cmds:
      - go run . backfill

  dart-client:
    desc: Generate Dart client for local development
    cmds:
      - buf generate protobuf --template buf.gen.dart.yaml
      - sh scripts/setup-dart-client.sh
      - echo "✅ Dart client ready for local development at dart-client/"
    generates:
      - dart-client/lib/src/api/v1/beer.pb.dart
      - dart-client/lib/src/api/v1/cellar.pb.dart
      - dart-client/lib/src/api/v1/user.pb.dart
